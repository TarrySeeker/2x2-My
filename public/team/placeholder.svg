<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Сотрудник 2х2" preserveAspectRatio="xMidYMid slice">
  <title>Сотрудник 2х2</title>
  <defs>
    <linearGradient id="bg2x2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4EA"/>
      <stop offset="55%" stop-color="#FFE8D6"/>
      <stop offset="100%" stop-color="#FFD6AF"/>
    </linearGradient>
    <linearGradient id="sil2x2" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2A2A2E"/>
      <stop offset="100%" stop-color="#101013"/>
    </linearGradient>
    <linearGradient id="acc2x2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFB547"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="400" height="400" fill="url(#bg2x2)"/>

  <!-- Структурная сетка 2x2 (отсылка к бренду): тонкие линии, намёк -->
  <g stroke="#1A1A1A" stroke-opacity="0.06" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
  </g>

  <!-- Четыре точки в узлах — акцент «2х2» -->
  <g fill="#FF6B00" fill-opacity="0.18">
    <circle cx="100" cy="100" r="3"/>
    <circle cx="300" cy="100" r="3"/>
    <circle cx="100" cy="300" r="3"/>
    <circle cx="300" cy="300" r="3"/>
  </g>

  <!-- Оранжевое гало за силуэтом -->
  <circle cx="200" cy="170" r="112" fill="url(#acc2x2)" fill-opacity="0.12"/>

  <!-- Плечи: мягкая трапеция со скруглением -->
  <path d="M 60 400
           L 60 360
           C 60 300, 120 260, 200 260
           C 280 260, 340 300, 340 360
           L 340 400 Z"
        fill="url(#sil2x2)"/>

  <!-- Голова -->
  <circle cx="200" cy="168" r="66" fill="url(#sil2x2)"/>

  <!-- Тонкое оранжевое кольцо вокруг головы — фирменный штрих -->
  <circle cx="200" cy="168" r="74" fill="none" stroke="url(#acc2x2)" stroke-width="2" stroke-opacity="0.55"/>

  <!-- Знак «2х2» в районе груди: два квадрата, разделённые крестом -->
  <g transform="translate(200 332)">
    <g fill="#FFFFFF" fill-opacity="0.9">
      <rect x="-22" y="-10" width="18" height="18" rx="3"/>
      <rect x="4"   y="-10" width="18" height="18" rx="3"/>
    </g>
    <!-- Маленький оранжевый крест «х» -->
    <g stroke="url(#acc2x2)" stroke-width="2.2" stroke-linecap="round">
      <line x1="-2" y1="-3" x2="2" y2="1"/>
      <line x1="2"  y1="-3" x2="-2" y2="1"/>
    </g>
  </g>
</svg>
